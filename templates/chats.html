{% extends "base.html" %}
{% block title %}AntiMAX-Чаты{% endblock %}
{% block main %}
<div class="chats-wrap">
    <div class="chats-toolbar">
        <h2>Чаты</h2>
        <div class="chat-actions">
            <button onclick="toggleForm('form-private')">+ Личный</button>
            <button onclick="toggleForm('form-group')">+ Группа</button>
        </div>
    </div>

    <div id="form-private" class="create-form hidden">
        <p class="form-label">Начать личный чат с:</p>
        <div class="user-list">
            {% for user in users %}
            <form method="POST" action="{{url_for('open_private_chat', target_user_id=user.id)}}">
                <button type="submit" class="user-btn">{{user.username}}</button>
            </form>
            {% else %}
            <p class="form-empty">Нет других пользователей</p>
            {% endfor %}
        </div>
    </div>

    <div id="form-group" class="create-form hidden">
        <form method="POST" action="{{url_for('create_group')}}">
            <div class="form-row">
                <input class="form-input" type="text" name="name" placeholder="Название группы" required>
                <button type="submit" class="user-btn">Создать</button>
            </div>
            <p class="form-label">Участники:</p>
            <div class="user-list">
                {% for user in users %}
                <label class="user-check">
                    <input type="checkbox" name="members" value="{{user.id}}">
                    {{user.username}}
                </label>
                {% else %}
                <p class="form-empty">Нет других пользователей</p>
                {% endfor %}
            </div>
        </form>
    </div>
</div>
</div>
{% endblock %}
